# Pinned runtime dependencies for reproducible Docker builds (default local-BLIP path).
#
# torch is installed from the CPU-only wheel index in the Dockerfile
# (--index-url https://download.pytorch.org/whl/cpu) so no CUDA is pulled.
#
# Regenerate with:  pip install -e . && pip freeze > requirements.lock
# (kept hand-curated here to the direct deps that matter for the image).

nuscenes-devkit==1.2.0
transformers==4.44.2
torch==2.4.1
Pillow==10.4.0
numpy==1.26.4
# Video decoding for the `video` loader; headless build (no GUI libs) so it
# stays lean and installs cleanly in the slim image. Baked in so the shipping
# image can ingest video out of the box, same as image folders and nuScenes.
opencv-python-headless==4.11.0.86

# Transitive deps of nuscenes-devkit, pinned to versions that ship cp312 wheels.
# nuscenes-devkit 1.1.x dragged in Shapely<2.0 and matplotlib<3.6, which have no
# wheels for modern Python on Linux and fail to compile in the slim image; 1.2.0
# allows Shapely 2.x / matplotlib 3.x, which install from wheels (no toolchain).
shapely==2.0.7
matplotlib==3.11.0
